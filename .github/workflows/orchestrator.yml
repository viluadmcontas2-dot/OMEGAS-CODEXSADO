name: omegas-reverse-orchestrator

on:
  workflow_dispatch:
    inputs:
      max_units:
        description: "Maximum WorkUnits to execute in this cycle"
        required: false
        default: "10"
  repository_dispatch:
    types: [omegas_reverse_continue]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: omegas-reverse-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate controller
        run: python -m unittest discover -s tests -v
      - name: Run one bounded controller cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_UNITS: ${{ github.event.inputs.max_units || '10' }}
        run: |
          python -m reverse_lab.controller \
            --state-path state/workunits.json \
            --corpus-root corpus/private \
            --artifacts-root artifacts \
            --max-units "$MAX_UNITS" \
            | tee controller-result.json
      - name: Commit durable state
        run: |
          git config user.name "omegas-reverse-runner"
          git config user.email "actions@users.noreply.github.com"
          git add state artifacts controller-result.json
          if git diff --cached --quiet; then
            echo "No durable state change."
          else
            git commit -m "chore: record orchestrator checkpoint"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "Unable to publish checkpoint after five attempts." >&2
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 10))
            done
          fi
      - name: Verify durable checkpoint
        if: ${{ success() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("state/workunits.json").read_text(encoding="utf-8"))
          allowed = {"ready", "running", "done", "blocked", "failed", "saturated"}
          statuses = {item.get("status") for item in state.get("workunits", [])}
          invalid = statuses - allowed
          if invalid:
              raise SystemExit(f"invalid statuses: {sorted(invalid)}")
          print(json.dumps({"statuses": sorted(statuses), "workunits": len(state.get("workunits", []))}, sort_keys=True))
      - name: Continue after durable checkpoint
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '"status": "ready"' state/workunits.json; then
            sleep 15
            printf '%s' '{"event_type":"omegas_reverse_continue","client_payload":{"source":"post_checkpoint"}}' | gh api "repos/${GITHUB_REPOSITORY}/dispatches" --method POST --input -
          else
            echo "No ready WorkUnit remains; remote protocol gate is closed or blocked."
          fi
