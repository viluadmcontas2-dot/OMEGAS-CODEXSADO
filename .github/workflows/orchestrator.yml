name: omegas-reverse-orchestrator

on:
  workflow_dispatch:
    inputs:
      max_units:
        description: "Maximum WorkUnits to execute in this cycle"
        required: false
        default: "10"
  repository_dispatch:
    types: [omegas_reverse_continue]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: omegas-reverse-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate controller
        run: python -m unittest discover -s tests -v
      - name: Run one bounded controller cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_UNITS: ${{ github.event.inputs.max_units || '10' }}
        run: |
          python -m reverse_lab.controller \
            --state-path state/workunits.json \
            --corpus-root corpus/private \
            --artifacts-root artifacts \
            --max-units "$MAX_UNITS" \
            | tee controller-result.json
      - name: Commit durable state
        run: |
          git config user.name "omegas-reverse-runner"
          git config user.email "actions@users.noreply.github.com"
          git add state artifacts controller-result.json
          if git diff --cached --quiet; then
            echo "No durable state change."
          else
            git commit -m "chore: record orchestrator checkpoint"
            git push
          fi
      - name: Continue after durable checkpoint
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '"status": "ready"' state/workunits.json; then
            gh api "repos/${GITHUB_REPOSITORY}/dispatches" --method POST --input - <<'JSON'
            {"event_type":"omegas_reverse_continue","client_payload":{"source":"post_checkpoint"}}
            JSON
          else
            echo "No ready WorkUnit remains; remote protocol gate is closed or blocked."
          fi
